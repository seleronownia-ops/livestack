name: iOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core:
    name: Core package tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/LiveStackCore

  ios:
    name: App build, tests and unsigned IPA (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 16 on the runner
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC" || true
          xcodebuild -version
      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -E "iPhone (16|15)" | head -1 | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          echo "name=${NAME:-iPhone 16}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${NAME:-iPhone 16}"
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build -project LiveStack.xcodeproj -scheme LiveStack -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" CODE_SIGNING_ALLOWED=NO 2>&1 | tee sim-build.log | (grep -E "error:|\*\* BUILD" || true)
          status=${PIPESTATUS[0]}
          python3 scripts/ci-report.py sim-build.log "$status" || true
          test "$status" -eq 0
      - name: Unit and integration tests
        run: |
          set -o pipefail
          xcodebuild test -project LiveStack.xcodeproj -scheme LiveStack -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" -only-testing:LiveStackTests CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult 2>&1 | tee unit-tests.log | (grep -E "Test Case|Executed|error:|\*\* TEST" || true)
          status=${PIPESTATUS[0]}
          python3 scripts/ci-report.py unit-tests.log "$status" || true
          test "$status" -eq 0
      - name: UI smoke test
        run: |
          set -o pipefail
          xcodebuild test -project LiveStack.xcodeproj -scheme LiveStack -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" -only-testing:LiveStackUITests CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui-tests.log | (grep -E "Test Case|Executed|error:|\*\* TEST" || true)
          status=${PIPESTATUS[0]}
          python3 scripts/ci-report.py ui-tests.log "$status" || true
          test "$status" -eq 0
      - name: Build an unsigned device binary
        run: |
          set -o pipefail
          xcodebuild build -project LiveStack.xcodeproj -scheme LiveStack -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" DEVELOPMENT_TEAM="" \
            2>&1 | tee device-build.log | (grep -E "error:|warning: .*signing|\*\* BUILD" || true)
          status=${PIPESTATUS[0]}
          python3 scripts/ci-report.py device-build.log "$status" || true
          if [ "$status" -ne 0 ]; then
            echo "::error::device build failed with status $status; last lines follow"
            tail -n 40 device-build.log | sed 's/^/::error::/'
            exit "$status"
          fi
          ls -R build/Build/Products | head -20
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/LiveStack.app ipa/Payload/
          (cd ipa && zip -qr ../LiveStack-unsigned.ipa Payload)
          ls -la LiveStack-unsigned.ipa
      - name: Upload the IPA (sign and install it with Sideloadly or AltStore)
        uses: actions/upload-artifact@v4
        with:
          name: LiveStack-unsigned-ipa
          path: LiveStack-unsigned.ipa
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
